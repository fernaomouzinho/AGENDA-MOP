{% extends "main/base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card">

                <div class="card-header bg-danger text-white">

                    <h5 class="mb-0">
                        Hamos Receptor WhatsApp
                    </h5>

                </div>


                <div class="card-body">

                    <p>
                        Ita boot hakarak hamos receptor ida ne'e?
                    </p>


                    <div class="alert alert-warning">

                        <strong>
                            {{ recipient.name }}
                        </strong>

                        <br>

                        {{ recipient.phone_number }}

                        <br>

                        Ajenda:
                        <strong>
                            {{ recipient.agenda.title }}
                        </strong>

                    </div>


                    <form method="POST">

                        {% csrf_token %}

                        <div class="d-flex justify-content-end gap-2">

                            <a
                                href="{% url 'whatsapp_recipient_list' %}"
                                class="btn btn-secondary"
                            >
                                Lae
                            </a>

                            <button
                                type="submit"
                                class="btn btn-danger"
                            >
                                <i class="fas fa-trash"></i>
                                Sin, Hamos
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
