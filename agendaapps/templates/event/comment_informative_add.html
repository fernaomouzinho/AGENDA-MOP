{% extends "layouts/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}


<div class="row d-flex justify-content-center ">
    <div class="col-sm-12 ">
        <div class="border-info shadow-lg bg-white d-flex justify-content-center">


            <div class="col-md-6" style="background-color:rgb(237, 246, 247)">
                <div class="row">
                    <div class="card-body">
                        <div class="card-header bg-card p-3 d-flex justify-content-between">
                            <div class="row flex-row pl-2">
                                <h5 class="text-light"><i class="fa fa-plus" style="font-size:18px"></i> Comment
                                    Informative Note
                                </h5>
                            </div>
                        </div>
                        <hr>

                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}

                            <h6>Title Note :</h6>


                            <div class="form-group">
                                <input type="text" class="form-control" id="exampleInputEmail1"
                                    aria-describedby="emailHelp" value="{{ single_informative.title }}" disabled>

                            </div>
                            <hr />
                            {{commentinformativeform | crispy}}
                            {{commentinformativeform.media | safe}}
                            <button type="submit" class="btn btn-primary pull-right ml-2">Submit</button>
                            <button class="btn btn-danger text-white pull-right"><a
                                    href="{%url 'executedInformative_list' %}"
                                    class="text-white text-decoration-none">Cancel</button>


                        </form>


                        </form>
                        <div>
                        </div>
                    </div> <!--end card-body-->
                </div>
                <!--end col-->
            </div>
            <!--end row-->

            <!--end card-body-->
        </div>
        <!--end card-->
    </div>

    {% endblock %}
    {% block scripts %}
    <script type="text/javascript">
        $(document).ready(function () {
            $('#example').DataTable();
        });
    </script>
    {% endblock %}
