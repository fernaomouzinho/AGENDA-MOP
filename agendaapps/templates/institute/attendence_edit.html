{% extends "layouts/base.html" %}
{% load static %}
{% load bootstrap4 %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row d-flex justify-content-center ">
    <div class="col-sm-12">
        <div class="border-info shadow-lg bg-white">


            <div class="col-md-6" style="background-color:rgb(221, 247, 251)">
                <div class="row">
                    <div class="card-body">
                        <div class="card-header bg-card pb-2 d-flex justify-content-between">
                            <div class="row flex-row">
                                <h5 class="text-light"> Edit Category Attendence</h5>
                            </div>
                        </div>
                        <hr>

                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="row d-flex justify-content-center">
                                <div class="col-lg-6">
                                    {{attendenceform | crispy}}
                                    {{attendenceform.media | safe}}
                                </div>
                                <div class="col-lg-7 d-flex justify-content-center">

                                    <button class="btn btn-danger text-white m-1"><a href="{%url 'attendence_list' %}"
                                            class="text-white text-decoration-none">Cancel</button>
                                    <button type="submit" class="btn btn-primary m-1 w-100">Save</button>
                                </div>
                            </div>



                        </form>
                        <div>
                        </div>
                    </div> <!--end card-body-->
                </div>
                <!--end col-->
            </div>
            <!--end row-->

            <!--end card-body-->
        </div>
        <!--end card-->
    </div>
    <!--end col-->
</div>
<!--end row-->

{% endblock %}
