{% extends "layouts/base.html" %}
{% load static %}
{% load bootstrap4 %}
{% load crispy_forms_tags %}
{% crispy form %}
{% block content %}
<div class="row pt-2 d-flex justify-content-center">
	<div class="col-sm-12 pt-2">

		<center>
			<div class="row d-flex justify-content-center">
				<div class="col-sm-12 pb-4 d-flex justify-content-between">
					<img src="{% static 'main/images/rdtl.jpg' %}" height="90%">
					<img src="{% static 'main/images/logo-mop.png' %}" height="70%">
				</div>

				<div class="col-sm-4">
					<h1 class="mb-5">SISTEMA REGISTRASAUN AJENDA</h1>
					<div class="card border-info shadow-lg mb-5">
						<div class="card-header bg-card" style="color: white">
							FAVOR TAMA
						</div>
						<div class="card-body">
							<form method="POST">
								{% csrf_token %}
								{{ form }}
								<div class="form-group d-flex align-items-center justify-content-between mt-4 mb-0">
									<button class="btn btn-sm btn-outline-info" type="submit">Tama <i
											class="fa fa-sign-in"></i></button>
								</div>
							</form>
						</div>
					</div>
					<!--end card-body-->
				</div>
				<!--end card-->
			</div>
			<hr />
			<h6>MINIST&#201;RIO DAS OBRAS PUBLICA</h6>
			<hr />

		</center>
	</div>

	<!--end col-->
</div>
<!--end row-->
{% endblock %}
