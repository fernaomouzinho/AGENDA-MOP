{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
<div class="row d-flex justify-content-center ">
  <div class="col-sm-12">
    <div class="border-info shadow-lg bg-white">
      <div class="card-body">
        <hr />
        <div class="row pt-2">
          <div class="col-md-12">
            <div class="row">
              <div class="card-body">
                <div class="card-header pb-2">
                  <div class="row d-flex justify-content-center">
                    <h2 class="text-success text-center">
                      MEETING AGENDA
                    </h2>

                  </div>

                </div>
                <hr>

                <form action="/action_page.php" class="was-validated">
                  <div class="row">
                    <div class="col-md-6">

                      <div class="form-group">
                        <div class="row">
                          <div class="col-md-12">
                            <label for="uname">MEETING TITLE:</label>
                            <input type="text" class="form-control" value="{{ single_agenda.title }}" disabled>
                          </div>
                        </div>
                      </div>

                      <div class="form-group">
                        <div class="row">

                          <div class="col-md-12">
                            <label for="uname">AGENDA CREATED BY:</label>
                            <input type="text" class="form-control" value="{{ single_agenda.institution }}" disabled>
                          </div>
                        </div>
                      </div>

                      <div class="form-group">
                        <div class="row">
                          <div class="col-md-6">
                            <label for="pwd">START DATE & TIME:</label>
                            <input type="text" class="form-control"
                              value="{{ single_agenda.start_time|date:'d/m/Y G:i' }}" disabled>
                          </div>
                          <div class="col-md-6">
                            <label for="pwd">END DATE & TIME:</label>
                            <input type="text" class="form-control"
                              value="{{ single_agenda.end_time|date:'d/m/Y G:i' }}" disabled>
                          </div>

                        </div>
                      </div>

                      <div class="form-group">
                        <div class="row">

                          <div class="col-md-12">
                            <label for="pwd">LOCATION:</label>
                            <input type="text" class="form-control" value="{{ single_agenda.location }}" disabled>
                          </div>
                        </div>
                      </div>

                    </div>

                    <div class="col-md-6">
                      <div class="form-group">
                        <label for="exampleFormControlTextarea1">OBSERVATION</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" disabled></textarea>
                      </div>
                    </div>
                  </div>

                </form>
                <hr>

<!--
                {% if single_agenda.catagenda.name_category == "Internal" %}

                <div class="card-header pb-2">
                  <div class="row d-flex justify-content-center">
                    <h3 class="text-success text-center">
                      INVITE FOR MEETING
                    </h3>
                  </div>
                </div>
                {% else %}
                <div class="card-header pb-2">
                  <div class="row d-flex justify-content-center">
                    <h3 class="text-success text-center">
                      DELEGATE FOR MEETING
                    </h3>
                  </div>
                </div>
                {% endif %}-->



                <hr>
              </div> <!--end card-body-->
            </div>
            <!--end col-->
          </div>
          <!--end row-->
        </div>
        <!--end card-body-->
      </div>
      <!--end card-->
    </div>
    <!--end col-->
  </div>
  <!--end row-->

  {% endblock %}
  {% block scripts %}
  <script type="text/javascript">
    $(document).ready(function () {
      $('#example').DataTable();
    });
  </script>
  {% endblock %}
