{% extends "layouts/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row d-flex justify-content-center ">
    <div class="col-sm-12">
        <div class="border-info shadow-lg bg-white">
            <div class="card-body">
                <div class="card-header bg-card pb-2 d-flex justify-content-between">
                    <div class="row flex-row">
                        <h5 class="text-light"><i class='fa fa-comment-alt' style='font-size:30px'></i> COMMENT
                            AGENDA</h5>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12">
                        <div class="row">
                            <div class="card-body">

                                <h3 class="text-black"> {{ single_agenda.title }}</h3>

                                <!-- COMMENT 1 - END -->


                                <form method="POST" enctype="multipart/form-data">
                                    {% csrf_token %}
                                    <div class="row">
                                        <div class="col-sm-12 col-lg-12">
                                            {{commentagendaform | crispy}}
                                            {{commentagendaform.media | safe}}
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary pull-right ml-2">Submit</button>

                                    <button class="btn btn-danger text-white pull-right"><a
                                            href="{%url 'concludedAgenda_list' %}"
                                            class="text-white text-decoration-none">Cancel</button>

                                </form>
                            </div> <!--end card-body-->
                        </div>
                        <!--end col-->
                    </div>
                    <!--end row-->
                </div>
                <!--end card-body-->
            </div>
            <!--end card-->
        </div>
        <!--end col-->
    </div>
    <!--end row-->

    {% endblock %}
