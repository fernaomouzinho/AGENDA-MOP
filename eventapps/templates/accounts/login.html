{% extends "layouts/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row pt-5 d-flex justify-content-center">
	<div class="col-sm-12 pt-5">

		<center>
			<div class="row d-flex justify-content-center">
				<div class="col-sm-12 pb-4 d-flex justify-content-between">
					<img src="{% static 'main/images/rdtl.jpg' %}" height="100%">
					<img src="{% static 'main/images/adn.png' %}" height="80%">
				</div>

			<div class="col-sm-4">
				<h1 class="mb-5">AGENDA SYSTEM</h1>
				<div class="card border-info shadow-lg mb-5">
					<div class="card-header bg-card" style="color: white">
						PLEASE LOGIN
					</div>
					<div class="card-body">
						<form method="POST">
							{% csrf_token %}
							{{ form|crispy }}
							<div class="form-group d-flex align-items-center justify-content-between mt-4 mb-0">
								<button class="btn btn-sm btn-outline-info" type="submit">Log In <i
										class="fa fa-sign-in"></i></button>
							</div>
						</form>
					</div>
						</div>
					<!--end card-body-->
				</div>
				<!--end card-->
			</div>
			<hr />
			<h6>MINIST&#201;RIO DO PLANO E ORDENAMENTO</h6>
			<h6>AG&#202;N&#199;IA DE DEZENVOLVIMENTO NACIONAL, INSTITUTO P&#218;BLICO (ADN,IP)</h6>
			<hr />

		</center>
	</div>

	<!--end col-->
</div>
<!--end row-->
{% endblock %}
