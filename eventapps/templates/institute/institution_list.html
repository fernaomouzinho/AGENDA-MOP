{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
<div class="row d-flex justify-content-center ">
    <div class="col-sm-12">

        <div class="border-info shadow-lg bg-white">


            <div class="card-body">
                <div class="row flex-row-reverse ">
                    <button type="button" class="btn btn-light border border-primary btn-sm mr-3">
                        <span class="fa fa-plus"></span><a class="text-primary " href="{% url 'institution_add' %}"
                            role="button">
                            Add Institution</a>
                    </button>
                </div>
                <div class="card-header bg-card pb-2 mt-2 d-flex justify-content-between">
                    <div class="row flex-row">
                        <h5 class="text-light"><i class="fa fa-list" style="font-size:18px;"></i> List of Institution
                        </h5>
                    </div>

                </div>
                <hr>
                <section id='no-more-tables'>
                    <table class="table table-sm" id="example" width="100%" cellspacing="0">
                        <thead>
                            <tr>
                                <th>NU.</th>
                                <th>NAME</th>
                                <th style="text-align:center;">ACTION</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for obj in institution_list %}

                            <tr>
                                <td data-title="Nu.">{{ forloop.counter }}</td>
                                <td data-title="Title">
                                    {{obj.name_institution }}
                                </td>
                                <td style="text-align:center;">
                                    <a href="{% url 'institution_edit' pk=obj.id %}" data-toggle="tooltip" title="Edit"
                                        class="btn btn-sm btn-warning"><i class='fa fa-edit'
                                            style='font-size:20px'></i></a>

                                    |

                                    <a href="{% url 'institution_delete' pk=obj.id %}" data-toggle="tooltip"
                                        title="Delete" class="btn btn-sm btn-danger"
                                        onclick="return confirm(' Are you ready to delete?')"><i class='fa fa-trash'
                                            style='font-size:20px'></i></a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </section>
            </div> <!--end card-body-->
        </div>
        <!--end col-->

    </div>
    <!--end col-->
</div>
<!--end row-->

{% endblock %}

{% block scripts %}
<script type="text/javascript">
    $(document).ready(function () {
        $('#example').DataTable();
    });
</script>
{% endblock %}
