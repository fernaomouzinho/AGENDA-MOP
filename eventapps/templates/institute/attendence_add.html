{% extends "layouts/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row d-flex justify-content-center ">
    <div class="col-sm-12">
        <div class="border-info shadow-lg bg-white d-flex justify-content-center">


            <div class="col-md-6" sstyle="background-color:rgb(237, 246, 247)">
                <div class="row">
                    <div class="card-body">
                        <div class="card-header bg-card p-3 d-flex justify-content-between">
                            <div class="row flex-row pl-2">
                                <h5 class="text-light"> <i class="fa fa-plus" style="font-size:18px"></i> Add
                                    Category Attendence</h5>
                            </div>
                        </div>
                        <hr>

                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="col-12">
                                {{attendenceform | crispy}}
                                {{attendenceform.media | safe}}
                            </div>
                            <div class="col-12 d-flex justify-content-end p-3"
                                style="background-color:rgb(195, 234, 218)">

                                <button class="btn btn-danger text-white mr-2"><a href="{%url 'informative_list' %}"
                                        class="text-white text-decoration-none">Cancel</button>
                                <button type="submit" class="btn btn-primary">Save</button>
                            </div>
                        </form>

                    </div> <!--end card-body-->
                </div>
                <!--end col-->
            </div>
            <!--end row-->

            <!--end card-body-->
        </div>
        <!--end card-->
    </div>
    <!--end col-->
</div>
<!--end row-->

{% endblock %}
